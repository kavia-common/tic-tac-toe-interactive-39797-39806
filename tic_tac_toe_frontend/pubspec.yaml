name: tic_tac_toe_frontend
description: "A simple Tic Tac Toe app with Ocean Professional styling."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # App assets root (kept for any future assets)
    - assets/
    # GoT-themed marker icons bundled for the board:
    # - assets/icons/stark_direwolf.png (Player X / House Stark)
    # - assets/icons/lannister_lion.png (Player O / House Lannister)
    - assets/icons/
